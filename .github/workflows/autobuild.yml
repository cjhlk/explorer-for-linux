name: Autobuild (Latest)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'  # 若无 lock 文件则移除

      - name: Cache Electron Builder
        uses: actions/cache@v3
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and package (Windows)
        run: npm run build -- --publish never   # 强制禁止 electron-builder 发布
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 跳过签名，避免下载 winCodeSign 超时

      - name: Upload artifacts for download
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: release/**/*
          if-no-files-found: error