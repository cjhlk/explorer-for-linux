name: Autobuild (Latest)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20          # 改用 20，避免 Node 18 相关弃用警告
          cache: 'npm'

      - name: Cache Electron Builder
        uses: actions/cache@v3
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        # 使用 npm install（不要求锁文件），若将来有 lock 文件也可自动使用
        run: npm install

      - name: Build and package (Windows)
        run: npm run build

      - name: Upload to Release (autobuild)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobuild
          name: "Autobuild (Latest)"
          prerelease: true
          files: |
            dist/**/*.exe
            dist/**/*.nupkg
            dist/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}