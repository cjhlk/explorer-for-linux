name: Autobuild (Latest)

on:
  push:
    branches:
      - main          # 每次 push 到 main 分支自动构建
  workflow_dispatch:  # 也可手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and package (Windows)
        run: npm run build

      - name: Upload to Release (autobuild)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobuild               # 固定标签名
          name: "Autobuild (Latest)"        # Release 标题
          prerelease: true                  # 标记为预发布，避免与正式版混淆
          files: |
            dist/*.exe
            dist/*.nupkg
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}