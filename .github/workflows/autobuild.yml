name: Autobuild (Latest)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # cache: 'npm'  # 若无 lock 文件则移除

      - name: Cache Electron Builder
        uses: actions/cache@v3
        with:
          path: ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build and package (Windows)
        run: npm run build
        env:
          ELECTRON_BUILDER_PUBLISH: never   # 关键：禁止 electron-builder 自动发布

      - name: Upload to Release (autobuild)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autobuild
          name: "Autobuild (Latest)"
          prerelease: true
          files: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/*.nupkg
            release/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}